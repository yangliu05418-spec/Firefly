name: Build immutable release and deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [release/candidate-3]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish immutable GHCR image
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/firefly
          tags: |
            type=raw,value=sha-${{ github.event.workflow_run.head_sha }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: OCI_REVISION=${{ github.event.workflow_run.head_sha }}
          platforms: linux/amd64
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/firefly
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  deploy:
    name: Deploy production by digest
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate deployment inputs
        id: release
        shell: bash
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/firefly@$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Configure pinned SSH trust
        shell: bash
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.PROD_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          install -m 0700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 0644 ~/.ssh/known_hosts
      - name: Pull and run root-owned deployment entrypoint
        shell: bash
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          PROD_HOST: ${{ vars.PROD_HOST }}
          PROD_USER: ${{ vars.PROD_USER }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_USER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_PULL_TOKEN" | ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$PROD_USER@$PROD_HOST" \
            "sudo /usr/local/sbin/firefly-ghcr-login '$GHCR_USER' && sudo /usr/local/sbin/firefly-deploy '$IMAGE' '${{ github.event.workflow_run.head_sha }}'"
