name: CI

on:
  pull_request:
    branches: [release/candidate-3]
  push:
    branches: [release/candidate-3]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A newer PR run may supersede an older review run. A candidate push can be
  # publishing or deploying, so it must finish instead of being killed halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-gates:
    name: Source safety gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Reject tracked credentials and release archives
        shell: bash
        run: |
          set -euo pipefail
          forbidden=("APIKEY+MODEL.txt" "参考文档.txt" "密钥.txt" "TOS Information.txt")
          for file in "${forbidden[@]}"; do
            if git ls-files --error-unmatch "$file" >/dev/null 2>&1; then
              echo "Forbidden file is tracked: $file" >&2
              exit 1
            fi
            git check-ignore -q "$file" || { echo "Forbidden file is not ignored: $file" >&2; exit 1; }
          done
          if git ls-files | grep -E '\.(tar\.gz|tgz)$' >/dev/null; then
            echo "Release archives must not be committed" >&2
            exit 1
          fi

      - name: Reject CRLF runtime files
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r file; do
            if LC_ALL=C grep -q $'\r' "$file"; then
              echo "CRLF is forbidden in runtime file: $file" >&2
              failed=1
            fi
          done < <(git ls-files '*.sh' 'Dockerfile' '*.service' '*.timer' '*.conf' '*.yml' '*.yaml')
          exit "$failed"

      - name: Validate runtime shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r script; do
            if head -n 1 "$script" | grep -q 'bash'; then
              bash -n "$script"
            else
              sh -n "$script"
            fi
          done < <(git ls-files '*.sh')

      - name: Exercise Firefly container ownership guards
        shell: bash
        run: |
          set -euo pipefail
          release_env=/etc/firefly/release.env
          backup_env=$(mktemp)
          retire_lock=$(mktemp)
          had_release_env=0
          if sudo test -e "$release_env"; then
            sudo cp "$release_env" "$backup_env"
            had_release_env=1
          fi
          cleanup() {
            docker rm -f firefly-web-blue firefly-guard-legacy >/dev/null 2>&1 || true
            if [ "$had_release_env" -eq 1 ]; then
              sudo cp "$backup_env" "$release_env"
            else
              sudo rm -f "$release_env"
            fi
            rm -f "$backup_env"
            rm -f "$retire_lock"
          }
          trap cleanup EXIT
          sudo install -d -m 0755 /etc/firefly
          printf '%s\n' 'FIREFLY_ACTIVE_SLOT=green' 'FIREFLY_ACTIVE_PORT=8091' | sudo tee "$release_env" >/dev/null
          docker pull alpine:3.20 >/dev/null

          docker run -d --name firefly-web-blue \
            --label com.firefly.role=web --label com.firefly.slot=blue \
            alpine:3.20 sleep 300 >/dev/null
          exec 7>"$retire_lock"
          flock 7
          env FIREFLY_DEPLOY_LOCK_FILE="$retire_lock" sh ops/firefly-retire-slot.sh blue
          test "$(docker inspect --format '{{.State.Running}}' firefly-web-blue)" = true
          flock -u 7
          sudo sh ops/firefly-retire-slot.sh blue
          ! docker inspect firefly-web-blue >/dev/null 2>&1

          docker run -d --name firefly-web-blue \
            --label com.firefly.role=cornfield --label com.firefly.slot=blue \
            alpine:3.20 sleep 300 >/dev/null
          if sudo sh ops/firefly-retire-slot.sh blue; then
            echo 'ownership guard accepted a non-Firefly role' >&2
            exit 1
          fi
          test "$(docker inspect --format '{{.State.Running}}' firefly-web-blue)" = true
          docker rm -f firefly-web-blue >/dev/null

          docker run -d --name firefly-guard-legacy \
            --label com.docker.compose.project=firefly \
            --label com.docker.compose.service=canvas-worker \
            alpine:3.20 sleep 300 >/dev/null
          sudo sh ops/firefly-retire-slot.sh legacy
          test "$(docker inspect --format '{{.State.Running}}' firefly-guard-legacy)" = false

          grep -q 'assert_slot_container.*current_slot' ops/firefly-deploy.sh
          grep -q 'assert_legacy_container.*service' ops/firefly-deploy.sh
          grep -q '/api/health/workers' ops/firefly-deploy.sh
          grep -q 'failed_worker_readiness' ops/firefly-deploy.sh

      - name: Verify co-hosted Nginx configuration is preserved
        shell: bash
        run: |
          set -euo pipefail
          test_root=$(mktemp -d)
          trap 'rm -rf "$test_root"' EXIT
          mkdir -p "$test_root"/{sites-enabled,sites-available,sites-archive,runtime,bin}
          printf '%s\n' 'server { listen 80; }' > "$test_root/firefly.conf"
          printf '%s\n' 'server { listen 443 ssl http2; }' > "$test_root/sites-available/internal-image-studio.conf"
          ln -s "$test_root/sites-available/internal-image-studio.conf" "$test_root/sites-enabled/internal-image-studio.conf"
          printf '%s\n' '#!/bin/sh' 'exit 0' > "$test_root/bin/nginx"
          printf '%s\n' '#!/bin/sh' 'exit 0' > "$test_root/bin/systemctl"
          chmod +x "$test_root/bin/nginx" "$test_root/bin/systemctl"
          NGINX_ENABLED_DIR="$test_root/sites-enabled" \
          NGINX_AVAILABLE_DIR="$test_root/sites-available" \
          NGINX_ARCHIVE_DIR="$test_root/sites-archive" \
          NGINX_RUNTIME_DIR="$test_root/runtime" \
          NGINX_BIN="$test_root/bin/nginx" \
          SYSTEMCTL_BIN="$test_root/bin/systemctl" \
            sudo --preserve-env=NGINX_ENABLED_DIR,NGINX_AVAILABLE_DIR,NGINX_ARCHIVE_DIR,NGINX_RUNTIME_DIR,NGINX_BIN,SYSTEMCTL_BIN \
              sh ops/install-nginx-config.sh "$test_root/firefly.conf"
          test -L "$test_root/sites-enabled/internal-image-studio.conf"
          test "$(readlink "$test_root/sites-enabled/internal-image-studio.conf")" = "$test_root/sites-available/internal-image-studio.conf"
          grep -q 'listen 443 ssl http2' "$test_root/sites-available/internal-image-studio.conf"
          test ! -e "$test_root/sites-archive/internal-image-studio.conf"
          ! grep -q 'listen 443 ssl http2' "$test_root/sites-enabled/firefly.conf"

      - name: Reject oversized tracked files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          failed=0
          base="$BASE_SHA"
          if [[ ! "$base" =~ ^[0-9a-f]{40}$ ]] || [[ "$base" == "0000000000000000000000000000000000000000" ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git rev-parse HEAD^)
          fi
          while IFS= read -r -d '' file; do
            [[ -f "$file" ]] || continue
            size=$(wc -c < "$file")
            if (( size > 20971520 )); then
              echo "New or changed tracked file exceeds 20 MiB: $file ($size bytes)" >&2
              failed=1
            fi
          done < <(git diff --name-only --diff-filter=ACMRT -z "$base" HEAD)
          exit "$failed"

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-build:
    name: Node 22 test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Pin npm 10 and install
        run: |
          npm install --global npm@10
          npm config set registry https://registry.npmjs.org
          npm ci
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=1
      - run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Exercise authenticated Canvas journeys
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - name: Exercise SQLite backup and restore drill
        shell: bash
        run: |
          set -euo pipefail
          test_dir=$(mktemp -d)
          trap 'rm -rf "$test_dir"' EXIT
          TEST_DB_PATH="$test_dir/source.db" node -e "const Database=require('better-sqlite3');const db=new Database(process.env.TEST_DB_PATH);db.exec(\"CREATE TABLE smoke(id INTEGER PRIMARY KEY, value TEXT);INSERT INTO smoke(value) VALUES ('ok')\");db.close()"
          DATABASE_PATH="$test_dir/source.db" BACKUP_PATH="$test_dir/backup.db" node ops/backup-db.mjs
          BACKUP_PATH="$test_dir/backup.db" node -e "const Database=require('better-sqlite3');const db=new Database(process.env.BACKUP_PATH,{readonly:true});if(db.pragma('integrity_check',{simple:true})!=='ok'||db.prepare('SELECT value FROM smoke').pluck().get()!=='ok')process.exit(1);db.close()"
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org

  container:
    name: Container build, smoke test and scan
    # Production is ARM64-only. Native ARM CI avoids building and scanning an
    # unused AMD64 image and primes the same cache consumed by publish.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          push: false
          tags: firefly-ci:${{ github.sha }}
          build-args: OCI_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test container health
        shell: bash
        run: |
          set -euo pipefail
          docker network create firefly-ci
          docker run -d --name firefly-ci-redis --network firefly-ci redis:7.4-alpine redis-server --appendonly no
          docker volume create firefly-ci-data
          docker run --rm --network firefly-ci -v firefly-ci-data:/data \
            -e PUBLIC_ORIGIN=http://127.0.0.1:18090 \
            -e REDIS_URL=redis://firefly-ci-redis:6379 \
            -e SESSION_SECRET=ci-only-session-secret-at-least-32-bytes \
            -e DATABASE_PATH=/data/firefly.db \
            -e MEDIA_STORAGE_BACKEND=legacy \
            firefly-ci:${{ github.sha }} node dist-server/migrate.js
          for role_command in 'worker:dist-server/worker.js' 'media:dist-server/media-worker.js' 'canvas:dist-server/canvas-worker.js'; do
            role=${role_command%%:*}
            command=${role_command#*:}
            docker run -d --name "firefly-ci-$role" --network firefly-ci \
              -v firefly-ci-data:/data \
              -e PUBLIC_ORIGIN=http://127.0.0.1:18090 \
              -e REDIS_URL=redis://firefly-ci-redis:6379 \
              -e SESSION_SECRET=ci-only-session-secret-at-least-32-bytes \
              -e DATABASE_PATH=/data/firefly.db \
              -e UPLOAD_DIR=/data/uploads \
              -e MEDIA_STORAGE_BACKEND=legacy \
              firefly-ci:${{ github.sha }} node "$command"
          done
          docker run -d --name firefly-ci-web --network firefly-ci -p 127.0.0.1:18090:8090 \
            -v firefly-ci-data:/data \
            -e PUBLIC_ORIGIN=http://127.0.0.1:18090 \
            -e REDIS_URL=redis://firefly-ci-redis:6379 \
            -e SESSION_SECRET=ci-only-session-secret-at-least-32-bytes \
            -e DATABASE_PATH=/data/firefly.db \
            -e UPLOAD_DIR=/data/uploads \
            -e MEDIA_STORAGE_BACKEND=legacy \
            firefly-ci:${{ github.sha }}
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18090/api/health/ready >/dev/null && \
               curl --fail --silent http://127.0.0.1:18090/api/health/workers >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs firefly-ci-web
          exit 1
      - name: Gate image on critical vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: firefly-ci:${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          scanners: vuln
      - name: Produce vulnerability report
        if: always()
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: firefly-ci:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          scanners: vuln
      - name: Upload vulnerability report
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@988661ebb5e81487b3fb31b2185d2856c0a10679 # v4
        with:
          sarif_file: trivy-results.sarif

  publish:
    name: Publish immutable GHCR image
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/candidate-3'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/firefly
          tags: type=raw,value=sha-${{ github.sha }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: OCI_REVISION=${{ github.sha }}
          platforms: linux/arm64
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify production image platforms
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/firefly@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE" --raw | \
            jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | (index("arm64") != null and index("amd64") == null)'
      - uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4 # v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/firefly
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  deploy:
    name: Deploy production by digest
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/candidate-3'
    # Build the immutable image in parallel with the safety/test jobs, but do
    # not deploy until every gate has succeeded.
    needs: [source-gates, test-build, container, publish]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Validate deployment inputs
        id: release
        shell: bash
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/firefly@$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Configure pinned SSH trust
        shell: bash
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.PROD_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          install -m 0700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 0644 ~/.ssh/known_hosts
      - name: Pull and run root-owned deployment entrypoint
        shell: bash
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          PROD_HOST: ${{ vars.PROD_HOST }}
          PROD_USER: ${{ vars.PROD_USER }}
          GHCR_PULL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          GHCR_USER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          SSH_OPTIONS=(
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=15
            -o ServerAliveInterval=20
            -o ServerAliveCountMax=30
            -o TCPKeepAlive=yes
          )
          printf '%s\n' "$GHCR_PULL_TOKEN" | \
            ssh "${SSH_OPTIONS[@]}" "$PROD_USER@$PROD_HOST" \
              "sudo /usr/local/sbin/firefly-ghcr-login '$GHCR_USER'"
          if [ -n "$FEISHU_WEBHOOK_URL" ]; then
            printf '%s\n' "$FEISHU_WEBHOOK_URL" | \
              ssh "${SSH_OPTIONS[@]}" "$PROD_USER@$PROD_HOST" \
                "sudo /usr/local/sbin/firefly-alerts-configure"
          fi
          ssh "${SSH_OPTIONS[@]}" "$PROD_USER@$PROD_HOST" \
            "sudo /usr/local/sbin/firefly-deploy '$IMAGE' '${{ github.sha }}'"
