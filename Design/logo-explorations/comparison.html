<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Firefly Möbius Logo Studies</title>
<style>
  *{box-sizing:border-box} body{margin:0;background:#0b0b0b;color:#edebe7;font-family:Arial,sans-serif}
  main{min-height:100vh;padding:56px;display:grid;place-items:center}.wrap{width:min(1160px,100%)}
  header{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid #303231;padding-bottom:18px;margin-bottom:30px}
  h1{font-size:18px;font-weight:400;letter-spacing:.12em;margin:0}header span{color:#8e908d;font:11px monospace}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#141515;border:1px solid #303231;border-radius:10px;padding:30px;min-height:410px;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .card img{width:230px;height:230px}.meta{width:100%;margin-top:24px;border-top:1px solid #303231;padding-top:18px;display:flex;justify-content:space-between;align-items:center}.meta b{font-size:13px;font-weight:400;letter-spacing:.1em}.meta span{color:#858885;font:10px monospace}
  .sizes{display:flex;gap:14px;align-items:end;margin-top:20px}.sizes img:nth-child(1){width:16px;height:16px}.sizes img:nth-child(2){width:24px;height:24px}.sizes img:nth-child(3){width:40px;height:40px}
  @media(max-width:800px){main{padding:24px}.grid{grid-template-columns:1fr}.card{min-height:360px}}
</style>
<main><div class="wrap"><header><h1>FIREFLY / MÖBIUS STUDIES</h1><span>OUTLINE · NO GLOW · OPTICAL CROSSING</span></header><section class="grid">
  <article class="card"><img src="firefly-p1-folded-ember.svg"><div class="meta"><b>P1 / FOLDED EMBER</b><span>HOLLOW VOLUME</span></div><div class="sizes"><img src="firefly-p1-folded-ember.svg"><img src="firefly-p1-folded-ember.svg"><img src="firefly-p1-folded-ember.svg"></div></article>
  <article class="card"><img src="firefly-p2-impossible-wing.svg"><div class="meta"><b>P2 / IMPOSSIBLE</b><span>OPTICAL FOLD</span></div><div class="sizes"><img src="firefly-p2-impossible-wing.svg"><img src="firefly-p2-impossible-wing.svg"><img src="firefly-p2-impossible-wing.svg"></div></article>
  <article class="card"><img src="firefly-p3-wing-prism.svg"><div class="meta"><b>P3 / WING PRISM</b><span>LOW POLY</span></div><div class="sizes"><img src="firefly-p3-wing-prism.svg"><img src="firefly-p3-wing-prism.svg"><img src="firefly-p3-wing-prism.svg"></div></article>
</section></div></main>
</html>
