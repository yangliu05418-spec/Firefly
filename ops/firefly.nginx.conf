server {
    listen 80;
    listen [::]:80;
    server_name firefly.kumadrama.com;
    return 301 https://$host$request_uri;
}

include /etc/nginx/firefly/upstream.conf;

server {
    listen 443 ssl;
    http2 on;
    server_name firefly.kumadrama.com;

    ssl_certificate /etc/nginx/ssl/kumadrama.com.crt;
    ssl_certificate_key /etc/nginx/ssl/kumadrama.com.key;

    client_max_body_size 10m;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;

    # Multipart merge + media validation can legitimately exceed the default API timeout.
    # The endpoint is idempotent, so a client can safely retry after a broken connection.
    location ~ ^/api/uploads/[^/]+/complete$ {
        client_max_body_size 1m;
        proxy_read_timeout 210s;
        proxy_send_timeout 210s;
        proxy_pass http://firefly_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/uploads/[^/]+/chunks$ {
        client_max_body_size 18m;
        proxy_request_buffering off;
        proxy_pass http://firefly_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://firefly_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
