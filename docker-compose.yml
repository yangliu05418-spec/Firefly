x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  migrate:
    build: .
    command: ["node", "dist-server/migrate.js"]
    restart: "no"
    env_file:
      - .env
      - .env.feishu
    volumes:
      - /srv/firefly/data:/data
    logging: *default-logging
  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
      - .env.feishu
    environment:
      TOS_PREVIEW_TRANSCODE_ENABLED: ${TOS_PREVIEW_TRANSCODE_ENABLED:-true}
      TOS_PREVIEW_MAX_BITRATE: ${TOS_PREVIEW_MAX_BITRATE:-3500000}
      TOS_UPLOAD_REQUEST_TIMEOUT_MS: ${TOS_UPLOAD_REQUEST_TIMEOUT_MS:-180000}
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - /srv/firefly/uploads:/data/uploads
      - /srv/firefly/data:/data
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 35s
    logging: *default-logging
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8090/api/health/ready').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 15s
      timeout: 5s
      retries: 5
  worker:
    build: .
    restart: unless-stopped
    command: ["node", "dist-server/worker.js"]
    env_file:
      - .env
      - .env.feishu
    volumes:
      - /srv/firefly/uploads:/data/uploads
      - /srv/firefly/data:/data
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 35s
    logging: *default-logging
    healthcheck:
      test: ["CMD", "node", "dist-server/worker-healthcheck.js", "generation"]
      interval: 15s
      timeout: 5s
      retries: 3
  image-worker:
    build: .
    restart: unless-stopped
    command: ["node", "dist-server/image-worker.js"]
    env_file:
      - .env
      - .env.feishu
    volumes:
      - /srv/firefly/data:/data
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 35s
    logging: *default-logging
    healthcheck:
      test: ["CMD", "node", "dist-server/worker-healthcheck.js", "image"]
      interval: 15s
      timeout: 5s
      retries: 3
  media-worker:
    build: .
    restart: unless-stopped
    command: ["node", "dist-server/media-worker.js"]
    env_file:
      - .env
      - .env.feishu
    environment:
      TOS_PREVIEW_TRANSCODE_ENABLED: ${TOS_PREVIEW_TRANSCODE_ENABLED:-true}
      TOS_PREVIEW_MAX_BITRATE: ${TOS_PREVIEW_MAX_BITRATE:-3500000}
      TOS_UPLOAD_REQUEST_TIMEOUT_MS: ${TOS_UPLOAD_REQUEST_TIMEOUT_MS:-180000}
      TOS_ARCHIVE_CONCURRENCY: ${TOS_ARCHIVE_CONCURRENCY:-3}
      TOS_URL_FETCH_ENABLED: ${TOS_URL_FETCH_ENABLED:-false}
      TOS_FETCH_DEADLINE_MS: ${TOS_FETCH_DEADLINE_MS:-180000}
      TOS_FETCH_MAX_WAIT_MS: ${TOS_FETCH_MAX_WAIT_MS:-300000}
      TOS_FETCH_POLL_INTERVAL_MS: ${TOS_FETCH_POLL_INTERVAL_MS:-5000}
      TOS_ARCHIVE_CHECKPOINT_TTL_SECONDS: ${TOS_ARCHIVE_CHECKPOINT_TTL_SECONDS:-86400}
      TOS_TRANSCODE_DEADLINE_MS: ${TOS_TRANSCODE_DEADLINE_MS:-600000}
    volumes:
      - /srv/firefly/data:/data
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 35s
    logging: *default-logging
    healthcheck:
      test: ["CMD", "node", "dist-server/worker-healthcheck.js", "media"]
      interval: 15s
      timeout: 5s
      retries: 3
  canvas-worker:
    build: .
    restart: unless-stopped
    command: ["node", "dist-server/canvas-worker.js"]
    env_file:
      - .env
      - .env.feishu
    volumes:
      - /srv/firefly/data:/data
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 35s
    logging: *default-logging
    healthcheck:
      test: ["CMD", "node", "dist-server/worker-healthcheck.js", "canvas"]
      interval: 15s
      timeout: 5s
      retries: 3
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "384mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - /srv/firefly/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging
